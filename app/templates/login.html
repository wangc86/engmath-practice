{% extends "base.html" %}
{% block title %}登入 — 工程數學練習系統{% endblock %}

{% block content %}
<div class="card auth-card">
  <h1>登入</h1>

  {% if error %}<p class="error">{{ error }}</p>{% endif %}

  <form method="post" action="/login" autocomplete="off">
    <label for="student_no">學號</label>
    <input type="text" id="student_no" name="student_no" required
           value="{{ student_no or '' }}" autocomplete="username">

    <label for="password">密碼</label>
    <input type="password" id="password" name="password" required
           autocomplete="current-password">

    <button type="submit" class="primary">登入</button>
  </form>

  <p class="hint">
    提醒：本系統為教師自架，非學校官方系統，請使用<strong>只用於本系統</strong>的密碼。
    忘記密碼請寫信給授課教師重設。
  </p>

  <p class="alt-link">還沒有帳號？<a href="/register">前往註冊</a></p>
</div>
{% endblock %}
