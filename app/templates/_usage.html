<section class="card usage" id="usage-panel"
         {% if oob %}hx-swap-oob="true"{% endif %}>
  <h2>我的練習量</h2>
  <p class="usage-total">累計出題 <strong>{{ usage.total }}</strong> 題</p>
  {% if usage.by_template %}
    <ul class="usage-list">
      {% for name, count in usage.by_template %}
        <li><span>{{ name }}</span><span class="count">{{ count }}</span></li>
      {% endfor %}
    </ul>
  {% else %}
    <p class="hint">還沒有練習紀錄。</p>
  {% endif %}
  <p class="hint">此紀錄僅供你自己與授課教師檢視用量，<strong>不作為評分依據</strong>。</p>
</section>
