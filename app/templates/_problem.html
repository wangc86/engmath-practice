<article class="card problem" id="problem-card">
  <div class="problem-meta">
    <span class="tag">{{ template_name }}</span>
    <span class="tag tag-muted">Difficulty {{ problem.difficulty }} · {{ difficulty_label }}</span>
    <span class="tag tag-muted">#{{ problem.seed }}</span>
  </div>

  <p class="statement">{{ problem.statement }}</p>

  <div class="statement-math">$${{ problem.statement_latex }}$$</div>

  {% include "_answer_form.html" %}

  <div id="feedback-area"></div>
  <div id="solution-area"></div>
</article>

{% with oob = True %}{% include "_usage.html" %}{% endwith %}
