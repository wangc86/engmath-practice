[pytest]
testpaths = tests
markers =
    dsp_js: **需要 node** 的測試——瀏覽器端 DSP 的數值斷言（PLAN.md §8.4 方案 B）
        與展示 JS 的冒煙測試（§8.9.3）。名字沿用 2S2 當時的，但它現在的意思
        就是「這一項沒有 node 跑不動」，因此 `pytest -m "not dsp_js"` 是一個
        乾淨的「只跑 Python 那邊」。缺 node 時會 skip 並印出原因，不會靜默通過。
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
